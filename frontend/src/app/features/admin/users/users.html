<app-content-layout>
    <div class="mb-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">Gestión de Usuarios</h1>
        <p-button label="Crear Usuario" icon="pi pi-plus" (onClick)="createUser()"></p-button>
    </div>

    <app-data-table [data]="users()" [config]="tableConfig()" [totalRecords]="totalRecords()" [loading]="loading()"
        (lazyLoad)="onLazyLoad($event)" />
</app-content-layout>

<!-- Modal Ver Usuario -->
<app-view-user-dialog 
    [(visible)]="viewDialogVisible" 
    [user]="selectedUser()" 
    (closed)="closeViewDialog()" />

<!-- Modal Editar Usuario -->
<app-edit-user-dialog 
    [(visible)]="editDialogVisible" 
    [user]="selectedUser()" 
    (saved)="saveEditUser($event)"
    (closed)="closeEditDialog()" />

<!-- Modal Crear Usuario -->
<app-create-user-dialog 
    [(visible)]="createDialogVisible" 
    (saved)="saveCreateUser($event)"
    (closed)="closeCreateDialog()" />
